[package]
name = "cosmic-webview"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Servo-based WebView widget for the COSMIC Desktop environment"
license = "MPL-2.0"

[dependencies]
# Web engine — servo 0.2.0 is not yet published on crates.io; pinned to a
# specific commit on main. Switch to version = "0.2.0" once published.
servo = { git = "https://github.com/servo/servo", rev = "c2f705ca2ff", default-features = false, features = ["js_jit", "vello", "baked-in-resources"] }

# surfman, gleam and glow are used directly in rendering.rs to implement
# servo::RenderingContext with a GPU adapter and no window handle. Versions
# must be compatible with what servo 0.2.0 uses internally.
surfman      = { version = "0.12", features = ["chains"] }
gleam        = "0.15"
glow         = "0.17.0"

# UI toolkit (not yet on crates.io) — wgpu is always required for GPU frame rendering
libcosmic    = { package = "libcosmic", path = "../cosmic-epoch/libcosmic", features = ["wgpu"] }
iced_wgpu    = { path = "../cosmic-epoch/libcosmic/iced/wgpu" }

# Event loop waker channel — Send + Sync + Clone, suitable for crossing the
# Servo/iced boundary without requiring Servo to be Send.
async-channel = "2"

# URL parsing and physical pixel sizes
url = "2.5"
dpi = "0.1"
euclid = "0.22"

# Structured logging used throughout the library
tracing = "0.1"

# TLS provider — must be initialised once before Servo starts networking.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[[example]]
name = "browser"
# The browser example needs the winit+wgpu feature set from libcosmic.
required-features = ["browser-example"]

[features]
# Enable the XDG desktop portal file chooser (Wayland-native, requires D-Bus).
# Without this feature FilePicker controls are auto-dismissed.
xdg-portal = ["libcosmic/xdg-portal"]

browser-example = [
    "libcosmic/winit",
    "xdg-portal",
]
